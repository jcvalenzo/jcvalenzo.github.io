<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil de desarrollador</title>
  <meta name="description" content="Perfil de desarrollador.">

  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<main>

  <noscript>
    <div class="nes-container is-dark">
      <p>Esta página necesita JavaScript para mostrar el perfil.</p>
    </div>
  </noscript>

  <div id="error" class="nes-container is-dark with-title" hidden>
    <p class="title">Error</p>
    <p id="error-text"></p>
  </div>

  <header id="hero" class="nes-container is-dark with-title" hidden>
    <p class="title">Jugador 1</p>
    <div class="hero"></div>
    <div class="links"></div>
  </header>

  <section id="about" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Sobre mí</p>
      <p class="content"></p>
    </div>
  </section>

  <section id="skills" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Habilidades</p>
      <div class="bars"></div>
      <div class="tools" hidden>
        <p>Otras herramientas:</p>
        <p class="badges"></p>
      </div>
    </div>
  </section>

  <section id="experience" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Experiencia</p>
      <div class="entries"></div>
    </div>
  </section>

  <section id="projects" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Proyectos</p>
      <div class="grid"></div>
    </div>
  </section>

  <section id="education" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Educación</p>
      <div class="entries"></div>
    </div>
  </section>

  <section id="contact" hidden>
    <div class="nes-container is-dark with-title">
      <p class="title">Contacto</p>
      <p class="content"></p>
      <div class="links"></div>
    </div>
  </section>

  <footer>Hecho con <a href="https://nostalgic-css.github.io/NES.css/" target="_blank" rel="noopener">NES.css</a></footer>
</main>

<script src="js/main.js"></script>
</body>
</html>
