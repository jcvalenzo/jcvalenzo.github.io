<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="Juan Claudio Valenzuela Ortega, Software Engineer especializado en Java y Spring Boot.">
  <title>Juan Claudio Valenzuela Ortega | Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5.0.8/index.min.css" rel="stylesheet">
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main>
    <section class="nes-container with-title profile-card" id="main-container">
      <div class="top-bar">
        <p class="title status-title">
          <span class="status-dot" aria-hidden="true"></span> PLAYER 01 · ONLINE
        </p>
        <button id="theme-toggle" class="nes-btn is-small" type="button" aria-label="Cambiar modo de color">
          ☀️ LIGHT
        </button>
      </div>

      <header class="profile-main">
        <div id="avatar-container" class="avatar" aria-hidden="true">
          <span id="avatar-fallback">JV</span>
        </div>
        <div class="identity">
          <p class="eyebrow">&gt; BACKEND DEVELOPER</p>
          <h1 id="name">CARGANDO...</h1>
          <p id="headline" class="headline"></p>
          <p id="location" class="location"></p>
        </div>
      </header>

      <div class="nes-balloon from-left about-balloon" id="about-balloon">
        <p id="about" class="about"></p>
      </div>

      <div class="nes-container with-title inner-box">
        <p class="title">QUEST ACTUAL</p>
        <div class="experience-line">
          <i class="nes-icon coin is-small" aria-hidden="true"></i>
          <span id="experience"></span>
        </div>
      </div>

      <div class="nes-container with-title inner-box">
        <p class="title">INVENTARIO / STACK</p>
        <div id="skills" class="skills" aria-label="Tecnologías principales"></div>
      </div>

      <div class="cta-panel">
        <p id="cta-copy"></p>
        <div class="social-links" aria-label="Enlaces sociales">
          <a id="github-link" class="social-btn" target="_blank" rel="noopener noreferrer" title="GitHub">
            <i class="nes-icon github is-medium"></i>
          </a>
          <a id="linkedin-link" class="social-btn" target="_blank" rel="noopener noreferrer" title="LinkedIn">
            <i class="nes-icon linkedin is-medium"></i>
          </a>
        </div>
      </div>

      <footer>
        HECHO CON <i class="nes-icon is-small heart" aria-hidden="true"></i> Y 
        <a href="https://nostalgic-css.github.io/NES.css/" target="_blank" rel="noopener noreferrer">NES.css</a>
      </footer>
    </section>
  </main>
  <script src="js/main.js" defer></script>
</body>
</html>
